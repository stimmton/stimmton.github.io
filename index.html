<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Audio Scope" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <title>Audio Scope</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #0b1020; color: #f8fafc; display: grid; place-items: center; padding: 24px; }
    main { width: min(760px, 100%); }
    h1 { margin: 0 0 8px; font-size: clamp(2rem, 8vw, 4rem); }
    p { color: #cbd5e1; }
    .card { background: #111827; border: 1px solid #334155; border-radius: 20px; padding: 20px; box-shadow: 0 20px 50px rgba(0,0,0,.35); }
    button { width: 100%; font: inherit; font-weight: 700; font-size: 1.05rem; border: 0; border-radius: 14px; padding: 16px; background: #f8fafc; color: #0f172a; }
    button:disabled { opacity: .6; }
    canvas { width: 100%; height: 220px; margin-top: 18px; display: block; border-radius: 14px; background: #020617; border: 1px solid #1e293b; }
    .meter { margin-top: 16px; height: 18px; background: #020617; border: 1px solid #334155; border-radius: 999px; overflow: hidden; }
    .fill { height: 100%; width: 0%; background: linear-gradient(90deg,#22c55e,#eab308,#ef4444); transition: width 50ms linear; }
    .row { display: flex; justify-content: space-between; gap: 12px; margin-top: 10px; color: #cbd5e1; font-variant-numeric: tabular-nums; }
    .status { margin-top: 14px; min-height: 1.5em; }
    .ok { color: #86efac; }
    .error { color: #fca5a5; }
    .small { font-size: .9rem; color: #94a3b8; }
  </style>
</head>
<body>
  <main>
    <h1>Audio Scope</h1>
    <p>Offline microphone proof-of-concept for iPhone and desktop.</p>
    <section class="card">
      <button id="toggle">Start microphone</button>
      <div class="status" id="status">Tap the button and allow microphone access.</div>
      <canvas id="scope" width="1200" height="360" aria-label="Live microphone waveform"></canvas>
      <div class="meter"><div id="fill" class="fill"></div></div>
      <div class="row"><span>Input level</span><strong id="level">0.0%</strong></div>
      <div class="row"><span>Sample rate</span><strong id="sampleRate">—</strong></div>
      <p class="small">Audio stays on this device. Nothing is uploaded.</p>
    </section>
  </main>
<script>
let ctx, analyser, source, stream, raf;
const button = document.getElementById('toggle');
const statusEl = document.getElementById('status');
const canvas = document.getElementById('scope');
const c = canvas.getContext('2d');
const fill = document.getElementById('fill');
const levelEl = document.getElementById('level');
const sampleRateEl = document.getElementById('sampleRate');

function setStatus(text, cls='') {
  statusEl.textContent = text;
  statusEl.className = `status ${cls}`;
}

async function startMic() {
  button.disabled = true;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: false,
        noiseSuppression: false,
        autoGainControl: false
      }
    });
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') await ctx.resume();
    source = ctx.createMediaStreamSource(stream);
    analyser = ctx.createAnalyser();
    analyser.fftSize = 2048;
    analyser.smoothingTimeConstant = 0.15;
    source.connect(analyser);
    sampleRateEl.textContent = `${ctx.sampleRate.toLocaleString()} Hz`;
    button.textContent = 'Stop microphone';
    setStatus('Microphone active.', 'ok');
    draw();
  } catch (err) {
    console.error(err);
    setStatus(`Could not start microphone: ${err.message || err}`, 'error');
  } finally {
    button.disabled = false;
  }
}

function stopMic() {
  cancelAnimationFrame(raf);
  stream?.getTracks().forEach(t => t.stop());
  ctx?.close();
  stream = ctx = analyser = source = null;
  fill.style.width = '0%';
  levelEl.textContent = '0.0%';
  sampleRateEl.textContent = '—';
  c.clearRect(0,0,canvas.width,canvas.height);
  button.textContent = 'Start microphone';
  setStatus('Microphone stopped.');
}

function draw() {
  const data = new Uint8Array(analyser.fftSize);
  analyser.getByteTimeDomainData(data);

  let sum = 0;
  for (const v of data) {
    const x = (v - 128) / 128;
    sum += x * x;
  }
  const rms = Math.sqrt(sum / data.length);
  const pct = Math.min(100, rms * 500);
  fill.style.width = `${pct}%`;
  levelEl.textContent = `${pct.toFixed(1)}%`;

  c.clearRect(0,0,canvas.width,canvas.height);
  c.strokeStyle = '#38bdf8';
  c.lineWidth = 4;
  c.beginPath();
  const slice = canvas.width / (data.length - 1);
  for (let i=0; i<data.length; i++) {
    const x = i * slice;
    const y = (data[i] / 255) * canvas.height;
    i === 0 ? c.moveTo(x,y) : c.lineTo(x,y);
  }
  c.stroke();
  raf = requestAnimationFrame(draw);
}

button.addEventListener('click', () => stream ? stopMic() : startMic());

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
}

if (!navigator.mediaDevices?.getUserMedia) {
  button.disabled = true;
  setStatus('This browser does not expose microphone capture.', 'error');
}
</script>
</body>
</html>
