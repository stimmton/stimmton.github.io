<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />

  <title>Stimmton</title>

  <meta name="description" content="Stimmton instrument tuner" />
  <meta name="theme-color" content="#111827" />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Stimmton" />

  <link rel="manifest" href="manifest.webmanifest" />

  <link
    rel="icon"
    type="image/png"
    sizes="32x32"
    href="icons/stimmton-favicon-32.png"
  />

  <link
    rel="apple-touch-icon"
    sizes="192x192"
    href="icons/stimmton-icon-192.png"
  />

  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <main>
    <h1>Stimmton</h1>
    <p>Instrument tuner</p>

    <section class="card">
      <button id="toggle">Start microphone</button>

      <div class="status" id="status">
        Tap the button and allow microphone access.
      </div>

      <canvas
        id="scope"
        width="1200"
        height="360"
        aria-label="Live microphone waveform"
      ></canvas>

      <div class="meter">
        <div id="fill" class="fill"></div>
      </div>

      <div class="row">
        <span>Input level</span>
        <strong id="level">0.0%</strong>
      </div>

      <div class="row">
        <span>Sample rate</span>
        <strong id="sampleRate">—</strong>
      </div>

      <p class="small">Audio stays on this device. Nothing is uploaded.</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
